name: Build Alpha App Store V1 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper files
        run: |
          JAR="https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          SCRIPT="https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching official Gradle 8.9 wrapper jar"
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "$JAR"
          fi
          if [ ! -f gradlew ]; then
            echo "Fetching official Gradle 8.9 wrapper script"
            curl -fsSL -o gradlew "$SCRIPT"
          fi
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Alpha-App-Store-V1.apk

      - name: Upload Alpha-App-Store-V1-APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-App-Store-V1-APK
          path: dist/Alpha-App-Store-V1.apk
          if-no-files-found: error

      # Publish the APK as a public GitHub Release asset. Releases are
      # downloadable by anyone - no GitHub account needed - unlike Actions
      # artifacts which require authentication. The v1.0.0 release is kept
      # up to date on every successful build, so the stable link
      # /releases/latest/download/Alpha-App-Store-V1.apk always serves the
      # newest APK.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/Alpha-App-Store-V1.apk --clobber
          else
            gh release create v1.0.0 dist/Alpha-App-Store-V1.apk \
              --title "Alpha App Store V1" \
              --notes "Official Alpha App Store V1 release APK. Install directly on Android 8.0+."
          fi
